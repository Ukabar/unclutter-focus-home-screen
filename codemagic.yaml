workflows:
  testFlight:
    name: "Stillscreen: Focus Launcher"

    integrations:
      app_store_connect: SpeedTeste

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        provisioning_profiles:
          - ZyverioFocusLauncher
          - ZyverioFocusLauncherWidget

    scripts:
      - name: Use CocoaPods for Flutter iOS plugins
        script: |
          set -euo pipefail

          flutter config --no-enable-swift-package-manager
          flutter config --list | grep -F "enable-swift-package-manager: false"

      - name: Clean Flutter build artifacts
        script: |
          set -euo pipefail
          flutter clean

      - name: Get Flutter packages
        script: |
          set -euo pipefail
          flutter pub get

      - name: Verify Flutter iOS dependency manager
        script: |
          set -euo pipefail

          test -f ios/Podfile
          grep -F "platform :ios, '14.0'" ios/Podfile >/dev/null
          grep -F "flutter_ios_podfile_setup" ios/Podfile >/dev/null
          grep -F "use_frameworks!" ios/Podfile >/dev/null
          grep -F "use_modular_headers!" ios/Podfile >/dev/null
          grep -F "flutter_install_all_ios_pods" ios/Podfile >/dev/null
          test -f pubspec.lock
          test -f .flutter-plugins-dependencies

          grep -F '"google_mobile_ads"' .flutter-plugins-dependencies >/dev/null || {
            echo "google_mobile_ads was not resolved by Flutter."
            exit 1
          }

          grep -F '"webview_flutter_wkwebview"' .flutter-plugins-dependencies >/dev/null || {
            echo "webview_flutter_wkwebview was not resolved by Flutter."
            exit 1
          }

          grep -F '"swift_package_manager_enabled":{"ios":false' .flutter-plugins-dependencies >/dev/null || {
            echo "Swift Package Manager is still enabled for iOS plugins."
            cat .flutter-plugins-dependencies
            exit 1
          }

          ! grep -R "FlutterGeneratedPluginSwiftPackage\|XCLocalSwiftPackageReference\|XCSwiftPackageProductDependency" \
            ios/Runner.xcodeproj/project.pbxproj >/dev/null || {
              echo "Stale Flutter Swift Package Manager references remain in project.pbxproj."
              exit 1
            }

      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail

          cd ios
          pod install --repo-update --verbose

          test -d .symlinks/plugins/google_mobile_ads || {
            echo "google_mobile_ads iOS plugin symlink is missing."
            exit 1
          }

          test -d .symlinks/plugins/webview_flutter_wkwebview || {
            echo "webview_flutter_wkwebview iOS plugin symlink is missing."
            exit 1
          }

          find .symlinks/plugins/google_mobile_ads -name "*.podspec" | grep -q . || {
            echo "google_mobile_ads local podspec is missing."
            exit 1
          }

          find .symlinks/plugins/webview_flutter_wkwebview -name "*.podspec" | grep -q . || {
            echo "webview_flutter_wkwebview local podspec is missing."
            exit 1
          }

      - name: Analyze Flutter project
        script: |
          set -euo pipefail
          flutter analyze

      - name: Run Flutter tests
        script: |
          set -euo pipefail
          flutter test

      - name: Set up code signing
        script: |
          set -euo pipefail
          xcode-project use-profiles

          echo "Checking generated export options..."
          test -f /Users/builder/export_options.plist

          echo "Available signing identities:"
          security find-identity -v -p codesigning || true

          echo "Installed provisioning profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true

      - name: Verify iOS app icons have no alpha
        script: |
          python3 - <<'PY'
          import pathlib
          import struct
          import sys

          icon_dir = pathlib.Path(
              "ios/Runner/Assets.xcassets/AppIcon.appiconset"
          )

          if not icon_dir.exists():
              print(f"AppIcon directory not found: {icon_dir}")
              sys.exit(1)

          failures = []
          png_files = sorted(icon_dir.glob("*.png"))

          if not png_files:
              print("No PNG files found in the iOS AppIcon set.")
              sys.exit(1)

          def png_info(path):
              data = path.read_bytes()

              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  failures.append(f"{path.name}: not a PNG file")
                  return

              width, height, bit_depth, color_type = struct.unpack(
                  ">IIBB",
                  data[16:26],
              )

              offset = 8
              has_trns = False

              while offset + 12 <= len(data):
                  length = struct.unpack(
                      ">I",
                      data[offset:offset + 4],
                  )[0]

                  chunk_type = data[offset + 4:offset + 8]

                  if chunk_type == b"tRNS":
                      has_trns = True

                  offset += 12 + length

                  if chunk_type == b"IEND":
                      break

              if color_type in (4, 6) or has_trns:
                  failures.append(
                      f"{path.name}: "
                      f"{width}x{height}, "
                      f"color_type={color_type}, "
                      f"tRNS={has_trns}"
                  )

          for path in png_files:
              png_info(path)

          if failures:
              print(
                  "Invalid iOS AppIcon PNG files "
                  "with alpha/transparency:"
              )
              print("\n".join(failures))
              sys.exit(1)

          print(
              "All iOS AppIcon PNG files are opaque "
              "and contain no transparency."
          )
          PY

      - name: Build signed IPA
        script: |
          set -euo pipefail

          echo "Flutter version:"
          flutter --version

          echo "Xcode version:"
          xcodebuild -version

          echo "Starting signed IPA build..."

          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

          echo "Build command completed."

          echo "Contents of build/ios:"
          find build/ios -maxdepth 5 -print || true

          IPA_PATH="$(
            find "$CM_BUILD_DIR/build/ios/ipa" \
              -maxdepth 1 \
              -type f \
              -name "*.ipa" \
              -print \
              -quit 2>/dev/null || true
          )"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: flutter build ipa finished but no IPA was found."
            echo "Searching the entire project for IPA files:"
            find "$CM_BUILD_DIR" -type f -name "*.ipa" -print || true

            echo "Searching for Xcode archives:"
            find "$CM_BUILD_DIR" -type d -name "*.xcarchive" -print || true

            exit 1
          fi

          echo "IPA successfully generated:"
          echo "$IPA_PATH"
          ls -lh "$IPA_PATH"

      - name: Verify packaged app
        script: |
          set -euo pipefail

          IPA_PATH="$(
            find "$CM_BUILD_DIR/build/ios/ipa" \
              -maxdepth 1 \
              -type f \
              -name "*.ipa" \
              -print \
              -quit 2>/dev/null || true
          )"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file found for verification."
            exit 1
          fi

          rm -rf /tmp/ping_test_ipa
          mkdir -p /tmp/ping_test_ipa

          unzip -q "$IPA_PATH" -d /tmp/ping_test_ipa

          APP_PATH="$(
            find /tmp/ping_test_ipa/Payload \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print \
              -quit 2>/dev/null || true
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No packaged .app was found inside the IPA."
            find /tmp/ping_test_ipa -maxdepth 4 -print || true
            exit 1
          fi

          echo "Packaged application found:"
          echo "$APP_PATH"

          if [ ! -f "$APP_PATH/Assets.car" ]; then
            echo "ERROR: Assets.car was not found."
            find "$APP_PATH" -maxdepth 2 -print || true
            exit 1
          fi

          assetutil --info "$APP_PATH/Assets.car" \
            > /tmp/ping_test_ipa/assets-car-info.json

          echo "Packaged application and Assets.car verified."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/ping_test_ipa/assets-car-info.json

    publishing:
      email:
        recipients:
          - hornet.devlo@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
