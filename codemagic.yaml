scripts:
  - name: Clean Flutter and iOS dependencies
    script: |
      set -euo pipefail

      flutter clean

      rm -rf ios/Pods
      rm -rf ios/.symlinks
      rm -rf ios/Flutter/ephemeral
      rm -f ios/Podfile.lock

  - name: Get Flutter packages
    script: |
      set -euo pipefail
      flutter pub get

  - name: Verify Flutter dependencies and Podfile
    script: |
      set -euo pipefail

      test -f ios/Podfile
      test -f pubspec.lock
      test -f .flutter-plugins-dependencies

      grep -F "google_mobile_ads:" pubspec.lock >/dev/null || {
        echo "google_mobile_ads is missing from pubspec.lock."
        exit 1
      }

      grep -F "webview_flutter_wkwebview:" pubspec.lock >/dev/null || {
        echo "webview_flutter_wkwebview is missing from pubspec.lock."
        exit 1
      }

      grep -F '"google_mobile_ads"' .flutter-plugins-dependencies >/dev/null || {
        echo "google_mobile_ads was not registered as a Flutter plugin."
        exit 1
      }

      grep -F '"webview_flutter_wkwebview"' .flutter-plugins-dependencies >/dev/null || {
        echo "webview_flutter_wkwebview was not registered as a Flutter plugin."
        exit 1
      }

      grep -F "platform :ios, '14.0'" ios/Podfile >/dev/null || {
        echo "Podfile does not declare iOS 14.0."
        exit 1
      }

      grep -F "flutter_ios_podfile_setup" ios/Podfile >/dev/null || {
        echo "flutter_ios_podfile_setup is missing."
        exit 1
      }

      grep -F "flutter_install_all_ios_pods" ios/Podfile >/dev/null || {
        echo "flutter_install_all_ios_pods is missing."
        exit 1
      }

      MANUAL_PODS="$(
        grep -nE \
          "pod ['\"](google_mobile_ads|webview_flutter|webview_flutter_wkwebview|Google-Mobile-Ads-SDK)['\"]" \
          ios/Podfile || true
      )"

      if [ -n "$MANUAL_PODS" ]; then
        echo "Invalid manually declared Flutter/Ads pods were found:"
        echo "$MANUAL_PODS"
        exit 1
      fi

      echo "Flutter dependency and Podfile checks passed."

  - name: Install CocoaPods dependencies
    script: |
      set -euo pipefail

      cd ios
      pod install --repo-update --verbose

      test -d .symlinks/plugins/google_mobile_ads || {
        echo "google_mobile_ads local plugin symlink was not generated."
        exit 1
      }

      test -d .symlinks/plugins/webview_flutter_wkwebview || {
        echo "webview_flutter_wkwebview local plugin symlink was not generated."
        exit 1
      }

      find .symlinks/plugins/google_mobile_ads \
        -name "*.podspec" -print | grep -q . || {
          echo "google_mobile_ads podspec is missing."
          exit 1
        }

      find .symlinks/plugins/webview_flutter_wkwebview \
        -name "*.podspec" -print | grep -q . || {
          echo "webview_flutter_wkwebview podspec is missing."
          exit 1
        }

      echo "CocoaPods and local Flutter plugins installed correctly."
